<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Write a story — commonplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><a class="brand auth-brand" th:href="@{/}"><span class="brand-mark">c.</span> commonplace</a><main class="auth-card editor-card"><div class="eyebrow">TAKE YOUR TIME</div><h1>Start with a thought.</h1><p class="auth-intro">A small idea is a good place to begin.</p>
<form th:action="@{/add}" th:object="${post}" method="post"><label for="title">TITLE</label><input id="title" th:field="*{title}" maxlength="180" placeholder="Give your story a name" required autofocus><label for="content">YOUR STORY</label><textarea id="content" th:field="*{content}" rows="10" maxlength="10000" placeholder="What have you been thinking about?" required></textarea><button class="button full-button" type="submit">Publish story <span>↗</span></button></form>
<a class="back-link" th:href="@{/}">← Save for later</a></main></body></html>
