<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in — commonplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><a class="brand auth-brand" th:href="@{/}"><span class="brand-mark">c.</span> commonplace</a><main class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Your next good read<br>is waiting.</h1><p class="auth-intro">Sign in and pick up where you left off.</p>
<div class="notice" th:if="${param.registered}">Your account is ready. You can log in now.</div><div class="notice" th:if="${param.logout}">You have been logged out.</div><div class="error" th:if="${param.error}">That username and password didn’t match. Try again.</div>
<form th:action="@{/login}" method="post"><label for="username">USERNAME</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button full-button" type="submit">Log in <span>↗</span></button></form>
<div class="auth-switch">New around here? <a th:href="@{/register}">Create an account</a></div><a class="back-link" th:href="@{/}">← Back to stories</a></main></body></html>
