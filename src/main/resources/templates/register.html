<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join — commonplace</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><a class="brand auth-brand" th:href="@{/}"><span class="brand-mark">c.</span> commonplace</a><main class="auth-card"><div class="eyebrow">MAKE YOURSELF AT HOME</div><h1>A fresh page<br>is yours.</h1><p class="auth-intro">Create an account to share your stories with the community.</p>
<div class="error" th:if="${Userexist}">That username is already taken. Try another one.</div><div class="error" th:if="${registrationError}" th:text="${registrationError}"></div><div class="notice" th:if="${param.success}">Account created! Log in to start writing.</div>
<form th:action="@{/register}" th:object="${user}" method="post"><label for="username">USERNAME</label><input id="username" th:field="*{username}" autocomplete="username" minlength="3" maxlength="40" required autofocus><label for="password">PASSWORD</label><input id="password" th:field="*{password}" type="password" autocomplete="new-password" minlength="8" required><button class="button full-button" type="submit">Create account <span>↗</span></button></form>
<div class="auth-switch">Already a member? <a th:href="@{/login}">Log in</a></div><a class="back-link" th:href="@{/}">← Back to stories</a></main></body></html>
